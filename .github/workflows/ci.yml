# Repeatable app checks for contributors; all services and account data are synthetic.
name: ci
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: node test/ui/update.mjs
      - run: node test/ui/plus.mjs
      - run: node test/ui/account.mjs
      - run: node test/ui/security.mjs
      - run: node test/ui/monkey.mjs --seed 1 --actions 60 --screens desktop,phone
